name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Validate version and generated repository metadata
        shell: pwsh
        run: ./.github/scripts/Check-ReleaseVersion.ps1 -UpdateRepositoryMetadata

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $destination = Join-Path $env:APPDATA 'XIVLauncher\addon\Hooks\dev'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\visland.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build .\visland.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = '.\ffxiv_visland\bin\x64\Release\visland\latest.zip'
          if (!(Test-Path -LiteralPath $package) -or (Get-Item -LiteralPath $package).Length -eq 0) {
            throw 'Release package is missing or empty'
          }

      - name: Verify package metadata
        shell: pwsh
        run: ./.github/scripts/Test-ReleasePackage.ps1

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Visland-Release
          path: ffxiv_visland/bin/x64/Release/visland/
          if-no-files-found: error
